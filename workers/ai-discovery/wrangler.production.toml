# PRODUCTION TEMPLATE — AI intent helper for the shop assistant (POST /ai/intent). Tracked in git with placeholders.
#   cp wrangler.production.toml wrangler.production.local.toml   (git-ignored), fill in, deploy ONLY after approval.
# No secret at all: Workers AI is a binding (no API key). Hard caps (src/config.js refuses anything else in production):
#   DAILY_AI_LIMIT <= 500 (≈ 3,500 Neurons/day at ~7 per request, inside the free 10,000/day), RATE_LIMIT_PER_MIN <= 20,
#   origins exactly https://dairsharaf.com + https://www.dairsharaf.com, KV required (shared daily counter + cache).
name = "REPLACE_WITH_AI_WORKER_NAME"
account_id = "REPLACE_WITH_PRODUCTION_CLOUDFLARE_ACCOUNT_ID"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[ai]
binding = "AI"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "41202"
simple = { limit = 10, period = 60 }

[[kv_namespaces]]
binding = "AI_KV"
id = "REPLACE_WITH_PRODUCTION_AI_KV_NAMESPACE_ID"

[vars]
ENVIRONMENT = "production"
AI_PROVIDER = "workers-ai"
AI_ENABLED = "true"
AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_TIMEOUT_MS = "2500"
DAILY_AI_LIMIT = "300"
RATE_LIMIT_PER_MIN = "10"
ALLOWED_ORIGINS = "https://dairsharaf.com,https://www.dairsharaf.com"
